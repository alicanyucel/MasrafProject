version: '3.8'
services:
  webapi:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__SqlServer=Server=db;Database=MasrafProjectDatabase;User=sa;Password=Your_password123;TrustServerCertificate=True;Encrypt=False
    depends_on:
      - db
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Your_password123
    ports:
      - "14333:1433"
    volumes:
      - mssql-data:/var/opt/mssql
volumes:
  mssql-data:
